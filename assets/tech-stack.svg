      <line x1="12" y1="12" x2="20" y2="6" stroke="#64748b" stroke-width="1.3"/>
      <line x1="12" y1="12" x2="20" y2="18" stroke="#64748b" stroke-width="1.3"/>
    </g>
    <text x="50" y="30" class="item-label" font-size="13.5">Machine Learning Fundamentals</text>
  </g>

  <!-- ======================================================= -->
  <!-- 6. LANGUAGE / DATABASE -->
