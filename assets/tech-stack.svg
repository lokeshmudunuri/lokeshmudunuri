      <circle cx="5" cy="12" r="3.5" fill="#38bdf8"/>
      <circle cx="19" cy="6" r="3.5" fill="#a855f7"/>
      <circle cx="19" cy="18" r="3.5" fill="#10b981"/>
      <path d="M8 11L16 7M8 13L16 17" stroke="#94a3b8" stroke-width="1.5"/>
    </g>
    <text x="50" y="30" class="item-label">REST APIs</text>
  </g>

