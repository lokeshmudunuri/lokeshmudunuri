  <!-- 4. API DEVELOPMENT -->
  <!-- ======================================================= -->
  <rect x="40" y="390" width="320" height="150" rx="18" fill="#111a2b" stroke="#2b3950" stroke-width="1.2"/>
  <text x="65" y="427" fill="#a78bfa" class="cat-header">API DEVELOPMENT</text>
  <line x1="65" y1="443" x2="335" y2="443" stroke="#26344b"/>

  <!-- REST APIs -->
  <g transform="translate(65, 463)" class="tile" filter="url(#tile-depth)">
    <rect width="270" height="48" rx="10" fill="url(#tile-bg)" stroke="#334155" stroke-width="0.8"/>
    <!-- REST Network Nodes Icon -->
