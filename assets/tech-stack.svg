<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 770" width="100%" role="img" aria-label="Technical Skills">
  <defs>
    <!-- Card Gradients -->
    <linearGradient id="main-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#070b14"/>
    </linearGradient>

    <linearGradient id="tile-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a2538"/>
      <stop offset="100%" stop-color="#121b2b"/>
    </linearGradient>

    <!-- Bevel & 3D Lighting -->
    <filter id="tile-depth" x="-10%" y="-15%" width="120%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <style>
    .section-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 28px; font-weight: 700; fill: #f8fafc; }
    .section-sub { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 14px; fill: #94a3b8; }
    .cat-header { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 14.5px; font-weight: 700; letter-spacing: 0.6px; }
    .item-label { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 14.5px; font-weight: 600; fill: #e2e8f0; }
    .item-sub { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 11px; font-weight: 500; fill: #94a3b8; }
    .tile { transition: transform 0.2s ease; }
    .tile:hover { filter: brightness(1.15); }
  </style>

  <!-- Background Base -->
  <rect width="1100" height="770" rx="24" fill="url(#main-bg)"/>
  <rect x="1" y="1" width="1098" height="768" rx="24" fill="none" stroke="#263247" stroke-width="1.8"/>

  <!-- Header -->
  <text x="50" y="58" class="section-title">Technical Skills</text>
  <text x="50" y="86" class="section-sub">Skills listed from my current resume</text>

  <!-- ======================================================= -->
  <!-- 1. FRONTEND -->
  <!-- ======================================================= -->
  <rect x="40" y="115" width="320" height="255" rx="18" fill="#111a2b" stroke="#2b3950" stroke-width="1.2"/>
  <text x="65" y="152" fill="#38bdf8" class="cat-header">FRONTEND</text>
  <line x1="65" y1="168" x2="335" y2="168" stroke="#26344b"/>

  <!-- HTML -->
  <g transform="translate(65, 185)" class="tile" filter="url(#tile-depth)">
    <rect width="270" height="48" rx="10" fill="url(#tile-bg)" stroke="#334155" stroke-width="0.8"/>
    <!-- HTML5 Shield Icon -->
    <g transform="translate(14, 11) scale(0.95)">
      <path d="M3 2L5 22L13.5 24L22 22L24 2H3Z" fill="#E34F26"/>
      <path d="M13.5 4V22.2L19.4 20.6L21.1 4H13.5Z" fill="#EF652A"/>
      <path d="M13.5 9.2H8.7L9.1 13.6H13.5V9.2ZM13.5 16.5L11.3 15.9L11.1 14.3H8.8L9.1 17.5L13.5 18.7V16.5Z" fill="#FFFFFF"/>
      <path d="M13.5 9.2V13.6H17.9L17.5 17.5L13.5 18.7V16.5L15.7 15.9L15.9 14.3H13.5V9.2Z" fill="#EBEBEB"/>
    </g>
    <text x="50" y="30" class="item-label">HTML</text>
  </g>

  <!-- CSS -->
  <g transform="translate(65, 245)" class="tile" filter="url(#tile-depth)">
    <rect width="270" height="48" rx="10" fill="url(#tile-bg)" stroke="#334155" stroke-width="0.8"/>
    <!-- CSS3 Shield Icon -->
    <g transform="translate(14, 11) scale(0.95)">
      <path d="M3 2L5 22L13.5 24L22 22L24 2H3Z" fill="#1572B6"/>
      <path d="M13.5 4V22.2L19.4 20.6L21.1 4H13.5Z" fill="#33A9DC"/>
      <path d="M13.5 9.2H8.7L9.1 13.6H13.5V9.2ZM13.5 16.5L11.3 15.9L11.1 14.3H8.8L9.1 17.5L13.5 18.7V16.5Z" fill="#FFFFFF"/>
      <path d="M13.5 9.2V13.6H17.9L17.5 17.5L13.5 18.7V16.5L15.7 15.9L15.9 14.3H13.5V9.2Z" fill="#EBEBEB"/>
    </g>
    <text x="50" y="30" class="item-label">CSS</text>
  </g>

  <!-- JavaScript -->
  <g transform="translate(65, 305)" class="tile" filter="url(#tile-depth)">
    <rect width="270" height="48" rx="10" fill="url(#tile-bg)" stroke="#334155" stroke-width="0.8"/>
    <!-- JS Icon -->
    <g transform="translate(14, 12)">
      <rect width="24" height="24" rx="4" fill="#F7DF1E"/>
      <text x="12" y="17" font-family="Arial, sans-serif" font-weight="900" font-size="12" fill="#000000" text-anchor="middle">JS</text>
    </g>
    <text x="50" y="30" class="item-label">JavaScript</text>
  </g>

  <!-- ======================================================= -->
  <!-- 2. REACT -->
  <!-- ======================================================= -->
  <rect x="380" y="115" width="320" height="255" rx="18" fill="#111a2b" stroke="#2b3950" stroke-width="1.2"/>
  <text x="405" y="152" fill="#61dafb" class="cat-header">REACT</text>
  <line x1="405" y1="168" x2="675" y2="168" stroke="#26344b"/>

  <!-- React.js -->
  <g transform="translate(405, 185)" class="tile" filter="url(#tile-depth)">
    <rect width="270" height="48" rx="10" fill="url(#tile-bg)" stroke="#334155" stroke-width="0.8"/>
    <!-- React Atom Icon -->
    <g transform="translate(14, 11) scale(1.05)">
      <ellipse cx="12" cy="12" rx="11" ry="4.3" fill="none" stroke="#61DAFB" stroke-width="1.3"/>
      <ellipse cx="12" cy="12" rx="11" ry="4.3" transform="rotate(60 12 12)" fill="none" stroke="#61DAFB" stroke-width="1.3"/>
      <ellipse cx="12" cy="12" rx="11" ry="4.3" transform="rotate(120 12 12)" fill="none" stroke="#61DAFB" stroke-width="1.3"/>
      <circle cx="12" cy="12" r="2.2" fill="#61DAFB"/>
    </g>
    <text x="50" y="30" class="item-label">React.js</text>
  </g>

  <!-- ======================================================= -->
  <!-- 3. BACKEND & APIs -->
  <!-- ======================================================= -->
  <rect x="720" y="115" width="340" height="255" rx="18" fill="#111a2b" stroke="#2b3950" stroke-width="1.2"/>
  <text x="745" y="152" fill="#a78bfa" class="cat-header">BACKEND &amp; APIs</text>
  <line x1="745" y1="168" x2="1035" y2="168" stroke="#26344b"/>

  <!-- Node.js -->
  <g transform="translate(745, 185)" class="tile" filter="url(#tile-depth)">
    <rect width="290" height="48" rx="10" fill="url(#tile-bg)" stroke="#334155" stroke-width="0.8"/>
    <!-- Node.js Hex Icon -->
    <g transform="translate(14, 11) scale(1)">
      <path d="M12 2L22 7.8V19.2L12 25L2 19.2V7.8L12 2Z" fill="#339933"/>
      <text x="12" y="17" font-family="Arial, sans-serif" font-weight="bold" font-size="10" fill="#FFFFFF" text-anchor="middle">node</text>
    </g>
    <text x="50" y="30" class="item-label">Node.js</text>
  </g>

  <!-- Express.js -->
  <g transform="translate(745, 245)" class="tile" filter="url(#tile-depth)">
    <rect width="290" height="48" rx="10" fill="url(#tile-bg)" stroke="#334155" stroke-width="0.8"/>
    <!-- Express.js Icon -->
    <g transform="translate(14, 12)">
      <rect width="24" height="24" rx="4" fill="#2d3748"/>
      <text x="12" y="17" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="700" font-size="11" fill="#FFFFFF" text-anchor="middle">ex</text>
    </g>
    <text x="50" y="30" class="item-label">Express.js</text>
  </g>

  <!-- FastAPI -->
  <g transform="translate(745, 305)" class="tile" filter="url(#tile-depth)">
    <rect width="290" height="48" rx="10" fill="url(#tile-bg)" stroke="#334155" stroke-width="0.8"/>
    <!-- FastAPI Bolt Icon -->
    <g transform="translate(14, 11) scale(1.05)">
