      <path d="M2 4H22L14 13V20L10 22V13L2 4Z" fill="none" stroke="#fbbf24" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/>
      <circle cx="16" cy="18" r="2" fill="#38bdf8"/>
    </g>
    <text x="50" y="30" class="item-label">Data Preprocessing</text>
  </g>

  <!-- Machine Learning Fundamentals -->
  <g transform="translate(405, 643)" class="tile" filter="url(#tile-depth)">
    <rect width="270" height="48" rx="10" fill="url(#tile-bg)" stroke="#334155" stroke-width="0.8"/>
    <!-- Neural Net / ML Graph Icon -->
    <g transform="translate(14, 12)">
      <circle cx="4" cy="6" r="2.5" fill="#fbbf24"/>
      <circle cx="4" cy="18" r="2.5" fill="#fbbf24"/>
      <circle cx="20" cy="6" r="2.5" fill="#38bdf8"/>
      <circle cx="20" cy="18" r="2.5" fill="#38bdf8"/>
      <circle cx="12" cy="12" r="3" fill="#f43f5e"/>
      <line x1="4" y1="6" x2="12" y2="12" stroke="#64748b" stroke-width="1.3"/>
