      <path d="M12 2C6.48 2 2 6.58 2 12.23C2 16.75 4.87 20.59 8.84 21.94C9.34 22.03 9.52 21.72 9.52 21.45C9.52 21.21 9.51 20.58 9.51 19.74C6.73 20.36 6.14 18.38 6.14 18.38C5.68 17.19 5.03 16.87 5.03 16.87C4.12 16.24 5.1 16.25 5.1 16.25C6.1 16.32 6.63 17.3 6.63 17.3C7.52 18.86 8.97 18.41 9.54 18.15C9.63 17.49 9.89 17.04 10.18 16.78C7.96 16.52 5.63 15.65 5.63 11.75C5.63 10.64 6.02 9.73 6.65 9.02C6.55 8.76 6.21 7.73 6.75 6.34C6.75 6.34 7.59 6.07 9.5 7.39C10.3 7.16 11.15 7.05 12 7.05C12.85 7.05 13.7 7.16 14.5 7.39C16.41 6.07 17.25 6.34 17.25 6.34C17.79 7.73 17.45 8.76 17.35 9.02C17.98 9.73 18.37 10.64 18.37 11.75C18.37 15.66 16.03 16.52 13.8 16.78C14.16 17.1 14.49 17.73 14.49 18.69C14.49 20.08 14.48 21.2 14.48 21.45C14.48 21.72 14.66 22.04 15.17 21.94C19.14 20.58 22 16.74 22 12.23C22 6.58 17.52 2 12 2Z" fill="#F1F5F9"/>
