      <rect x="9" y="4" width="4" height="18" rx="1.5" fill="#FF4A00"/>
      <rect x="15" y="8" width="4" height="14" rx="1.5" fill="#150458"/>
      <rect x="21" y="2" width="2" height="20" rx="1" fill="#E2E8F0"/>
    </g>
    <text x="50" y="30" class="item-label">Pandas</text>
  </g>

  <!-- NumPy -->
  <g transform="translate(405, 523)" class="tile" filter="url(#tile-depth)">
    <rect width="270" height="48" rx="10" fill="url(#tile-bg)" stroke="#334155" stroke-width="0.8"/>
    <!-- NumPy Matrix Cube Icon -->
    <g transform="translate(14, 12)">
      <rect x="2" y="2" width="9" height="9" rx="2" fill="#013243"/>
      <rect x="13" y="2" width="9" height="9" rx="2" fill="#4DABCF"/>
      <rect x="2" y="13" width="9" height="9" rx="2" fill="#4DABCF"/>
      <rect x="13" y="13" width="9" height="9" rx="2" fill="#013243"/>
