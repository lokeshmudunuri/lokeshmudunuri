      <path d="M12.6 25C19.1 25 18.7 22.2 18.7 22.2L18.7 19.3H12.4V18.4H21.2S25 18.9 25 12.4C25 6 21.7 6.2 21.7 6.2H19.7V9.1S19.8 12.5 16.3 12.5H10V12.6C10 12.6 6.5 12.4 6.5 18.7C6.5 25 12.6 25 12.6 25ZM16.1 23.1C15.4 23.1 14.9 22.5 14.9 21.8C14.9 21.2 15.4 20.6 16.1 20.6C16.7 20.6 17.3 21.2 17.3 21.8C17.3 22.5 16.7 23.1 16.1 23.1Z" fill="#FACC15"/>
    </g>
    <text x="44" y="30" class="item-label">Python</text>
  </g>

  <!-- SQLite -->
  <g transform="translate(202, 633)" class="tile" filter="url(#tile-depth)">
    <rect width="133" height="48" rx="10" fill="url(#tile-bg)" stroke="#334155" stroke-width="0.8"/>
    <!-- SQLite Cylinder Icon -->
