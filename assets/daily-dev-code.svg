<svg xmlns="http://www.w3.org/2000/svg" width="780" height="299" viewBox="0 0 780 299" fill="none">
  <style>
    .title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 700; font-size: 15px; fill: #58a6ff; }
    .category { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 11px; font-weight: 600; fill: #00d4ff; text-transform: uppercase; letter-spacing: 0.8px; }
    .takeaway { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 12px; fill: #8b949e; font-style: italic; }
    .badge { fill: #161b22; stroke: #30363d; stroke-width: 1; rx: 6; }
    .header-dot-red { fill: #ff5f56; }
    .header-dot-yellow { fill: #ffbd2e; }
    .header-dot-green { fill: #27c93f; }
  </style>

  <!-- Card Background -->
  <rect width="780" height="299" rx="10" fill="#0a0e27" stroke="#30363d" stroke-width="1.5"/>

  <!-- Window Header Controls -->
  <circle cx="28" cy="26" r="5" class="header-dot-red" />
  <circle cx="44" cy="26" r="5" class="header-dot-yellow" />
  <circle cx="60" cy="26" r="5" class="header-dot-green" />

  <!-- Badge / Category -->
  <rect x="80" y="16" width="280" height="20" rx="4" fill="#13233a" stroke="#00d4ff" stroke-opacity="0.3" stroke-width="1"/>
  <text x="90" y="30" class="category">⚡ AI Systems • Grounded Prompt Engineering</text>

  <!-- Title -->
  <text x="26" y="66" class="title">Separating Arithmetic Engines from Generative Reasoning</text>

  <!-- Code Container -->
  <rect x="20" y="80" width="740" height="144" rx="6" fill="#0d1117" stroke="#21262d" stroke-width="1"/>
    <text x="36" y="110" fill="#8b949e" font-family="Consolas, Fira Code, monospace" font-size="12.5"># Step 1: Deterministic code executes 100% of mathematical calculations</text>
    <text x="36" y="130" fill="#c9d1d9" font-family="Consolas, Fira Code, monospace" font-size="12.5">evidence = {&apos;runway_days&apos;: 4.2, &apos;stockout_risk&apos;: &apos;CRITICAL&apos;, &apos;daily_velocity&apos;: 18.5}</text>
    <text x="36" y="150" fill="#c9d1d9" font-family="Consolas, Fira Code, monospace" font-size="12.5"></text>
    <text x="36" y="170" fill="#8b949e" font-family="Consolas, Fira Code, monospace" font-size="12.5"># Step 2: Pass only verified JSON numbers to LLM for executive directives</text>
    <text x="36" y="190" fill="#c9d1d9" font-family="Consolas, Fira Code, monospace" font-size="12.5">prompt = f&apos;Summarize stock strategy using strictly this payload: {json.dumps(evidence)}&apos;</text>
    <text x="36" y="210" fill="#8b949e" font-family="Consolas, Fira Code, monospace" font-size="12.5"># Result: Zero math hallucinations. 100% auditable business logic.</text>

  <!-- Takeaway footer -->
  <text x="26" y="279" class="takeaway">💡 Takeaway: Never rely on LLMs to perform arithmetic; use deterministic code for math and models for reasoning.</text>
</svg>
