<svg xmlns="http://www.w3.org/2000/svg" width="780" height="339" viewBox="0 0 780 339" fill="none">
  <style>
    .title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 700; font-size: 15px; fill: #58a6ff; }
    .category { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 11px; font-weight: 600; fill: #00d4ff; text-transform: uppercase; letter-spacing: 0.8px; }
    .takeaway { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 12px; fill: #8b949e; font-style: italic; }
    .badge { fill: #161b22; stroke: #30363d; stroke-width: 1; rx: 6; }
    .header-dot-red { fill: #ff5f56; }
    .header-dot-yellow { fill: #ffbd2e; }
    .header-dot-green { fill: #27c93f; }
  </style>

  <!-- Card Background -->
  <rect width="780" height="339" rx="10" fill="#0a0e27" stroke="#30363d" stroke-width="1.5"/>

  <!-- Window Header Controls -->
  <circle cx="28" cy="26" r="5" class="header-dot-red" />
  <circle cx="44" cy="26" r="5" class="header-dot-yellow" />
  <circle cx="60" cy="26" r="5" class="header-dot-green" />

  <!-- Badge / Category -->
  <rect x="80" y="16" width="280" height="20" rx="4" fill="#13233a" stroke="#00d4ff" stroke-opacity="0.3" stroke-width="1"/>
  <text x="90" y="30" class="category">⚡ Java • Data Structures &amp; Algorithms</text>

  <!-- Title -->
  <text x="26" y="66" class="title">Fast Sliding Window Anomaly Detection</text>

  <!-- Code Container -->
  <rect x="20" y="80" width="740" height="184" rx="6" fill="#0d1117" stroke="#21262d" stroke-width="1"/>
    <text x="36" y="110" fill="#8b949e" font-family="Consolas, Fira Code, monospace" font-size="12.5">// Compute rolling max over transaction streams in O(N) using Monotonic Deque</text>
    <text x="36" y="130" fill="#c9d1d9" font-family="Consolas, Fira Code, monospace" font-size="12.5">Deque&lt;Integer&gt; deque = new ArrayDeque&lt;&gt;();</text>
    <text x="36" y="150" fill="#c9d1d9" font-family="Consolas, Fira Code, monospace" font-size="12.5">for (int i = 0; i &lt; nums.length; i++) {</text>
    <text x="36" y="170" fill="#c9d1d9" font-family="Consolas, Fira Code, monospace" font-size="12.5">    while (!deque.isEmpty() &amp;&amp; deque.peekFirst() &lt;= i - k) deque.pollFirst();</text>
    <text x="36" y="190" fill="#c9d1d9" font-family="Consolas, Fira Code, monospace" font-size="12.5">    while (!deque.isEmpty() &amp;&amp; nums[deque.peekLast()] &lt;= nums[i]) deque.pollLast();</text>
    <text x="36" y="210" fill="#c9d1d9" font-family="Consolas, Fira Code, monospace" font-size="12.5">    deque.offerLast(i);</text>
    <text x="36" y="230" fill="#c9d1d9" font-family="Consolas, Fira Code, monospace" font-size="12.5">    if (i &gt;= k - 1) maxWindow[i - k + 1] = nums[deque.peekFirst()];</text>
    <text x="36" y="250" fill="#c9d1d9" font-family="Consolas, Fira Code, monospace" font-size="12.5">}</text>

  <!-- Takeaway footer -->
  <text x="26" y="319" class="takeaway">💡 Takeaway: Monotonic deques efficiently maintain order in streaming time-series anomaly detection.</text>
</svg>
