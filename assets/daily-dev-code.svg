<svg xmlns="http://www.w3.org/2000/svg" width="780" height="319" viewBox="0 0 780 319" fill="none">
  <style>
    .title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 700; font-size: 15px; fill: #58a6ff; }
    .category { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 11px; font-weight: 600; fill: #00d4ff; text-transform: uppercase; letter-spacing: 0.8px; }
    .takeaway { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 12px; fill: #8b949e; font-style: italic; }
    .badge { fill: #161b22; stroke: #30363d; stroke-width: 1; rx: 6; }
    .header-dot-red { fill: #ff5f56; }
    .header-dot-yellow { fill: #ffbd2e; }
    .header-dot-green { fill: #27c93f; }
  </style>

  <!-- Card Background -->
  <rect width="780" height="319" rx="10" fill="#0a0e27" stroke="#30363d" stroke-width="1.5"/>

  <!-- Window Header Controls -->
  <circle cx="28" cy="26" r="5" class="header-dot-red" />
  <circle cx="44" cy="26" r="5" class="header-dot-yellow" />
  <circle cx="60" cy="26" r="5" class="header-dot-green" />

  <!-- Badge / Category -->
  <rect x="80" y="16" width="280" height="20" rx="4" fill="#13233a" stroke="#00d4ff" stroke-opacity="0.3" stroke-width="1"/>
  <text x="90" y="30" class="category">⚡ SQL &amp; SQLite • Analytical Indexing</text>

  <!-- Title -->
  <text x="26" y="66" class="title">Compound Indexes for Fast Range &amp; Aggregation Queries</text>

  <!-- Code Container -->
  <rect x="20" y="80" width="740" height="164" rx="6" fill="#0d1117" stroke="#21262d" stroke-width="1"/>
    <text x="36" y="110" fill="#8b949e" font-family="Consolas, Fira Code, monospace" font-size="12.5">-- Optimizes queries filtering by store and scanning recent 90-day intervals</text>
    <text x="36" y="130" fill="#79c0ff" font-family="Consolas, Fira Code, monospace" font-size="12.5">CREATE INDEX idx_sales_store_date </text>
    <text x="36" y="150" fill="#c9d1d9" font-family="Consolas, Fira Code, monospace" font-size="12.5">ON sales_records (store_id, transaction_date DESC);</text>
    <text x="36" y="170" fill="#c9d1d9" font-family="Consolas, Fira Code, monospace" font-size="12.5"></text>
    <text x="36" y="190" fill="#8b949e" font-family="Consolas, Fira Code, monospace" font-size="12.5">-- SQLite converts slow linear table scans into targeted index range lookups</text>
    <text x="36" y="210" fill="#c9d1d9" font-family="Consolas, Fira Code, monospace" font-size="12.5">SELECT sku, SUM(quantity) FROM sales_records</text>
    <text x="36" y="230" fill="#c9d1d9" font-family="Consolas, Fira Code, monospace" font-size="12.5">WHERE store_id = &apos;S004&apos; AND transaction_date &gt;= &apos;2026-06-01&apos;;</text>

  <!-- Takeaway footer -->
  <text x="26" y="299" class="takeaway">💡 Takeaway: Compound indexes with correct column order drastically cut analytical query execution time.</text>
</svg>
