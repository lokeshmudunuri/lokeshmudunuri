name: Sync Daily Dev Code & Streak Stats

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  update-assets:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Fetch and Cache Streak Stats SVG
        run: |
          curl -sL --retry 3 --retry-delay 5 \
            "https://streak-stats.demolab.com?user=${{ github.repository_owner }}&theme=tokyonight&hide_border=true&date_format=j%20M%5B%20Y%5D&ring=00d4ff&fire=ff6b35&currStreakLabel=00d4ff&sideLabels=00d4ff&background=0a0e27" \
            -o assets/github-streak-stats.svg

          if grep -q "<svg" assets/github-streak-stats.svg; then
            echo "Streak SVG fetched successfully."
          else
            echo "Streak SVG fetch failed or rate-limited; keeping existing file."
            git checkout -- assets/github-streak-stats.svg
          fi

      - name: Generate Curated Daily Dev Code SVG
        run: |
          python scripts/generate_daily_code.py

      - name: Commit and Push Updated Assets
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/github-streak-stats.svg assets/daily-dev-code.svg
          if ! git diff --staged --quiet; then
            git commit -m "chore(assets): update daily dev code & streak statistics [skip ci]"
            git push origin HEAD:main
          fi